<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed6ff"/>
      <stop offset="1" stop-color="#bff2c8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffcf24"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- sol (soleil) -->
  <g transform="translate(178,196)">
    <g stroke="#ffcf24" stroke-width="16" stroke-linecap="round">
      <line x1="0" y1="-96" x2="0" y2="-72"/>
      <line x1="68" y1="-68" x2="51" y2="-51"/>
      <line x1="96" y1="0" x2="72" y2="0"/>
      <line x1="-68" y1="-68" x2="-51" y2="-51"/>
      <line x1="-96" y1="0" x2="-72" y2="0"/>
    </g>
    <circle cx="0" cy="0" r="54" fill="url(#sun)"/>
  </g>

  <!-- arcoíris -->
  <g fill="none" stroke-linecap="round">
    <path d="M86 340 a170 170 0 0 1 340 0" stroke="#e63946" stroke-width="24"/>
    <path d="M114 340 a142 142 0 0 1 284 0" stroke="#ff8c1a" stroke-width="24"/>
    <path d="M142 340 a114 114 0 0 1 228 0" stroke="#ffcf24" stroke-width="24"/>
    <path d="M170 340 a86 86 0 0 1 172 0" stroke="#38b000" stroke-width="24"/>
    <path d="M198 340 a58 58 0 0 1 116 0" stroke="#2b7de9" stroke-width="24"/>
  </g>

  <!-- chispa (spark) -->
  <g transform="translate(388,150)" fill="#fff">
    <path d="M0 -34 C6 -10 10 -6 34 0 C10 6 6 10 0 34 C-6 10 -10 6 -34 0 C-10 -6 -6 -10 0 -34 Z"/>
  </g>
  <circle cx="120" cy="392" r="10" fill="#fff" opacity="0.9"/>
  <circle cx="430" cy="360" r="7" fill="#fff" opacity="0.9"/>
</svg>
